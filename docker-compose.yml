# VITAIA Medical AI - Production Docker Compose
version: "3.8"

services:
  # PostgreSQL Database with optimized settings
  postgres:
    image: postgres:16-alpine
    container_name: vitaia-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vitaia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vitaia_secure_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-vitaia_db}
      # Performance optimizations
      POSTGRES_SHARED_BUFFERS: 256MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 1GB
      POSTGRES_MAINTENANCE_WORK_MEM: 64MB
      POSTGRES_CHECKPOINT_COMPLETION_TARGET: 0.9
      POSTGRES_WAL_BUFFERS: 16MB
      POSTGRES_DEFAULT_STATISTICS_TARGET: 100
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-vitaia} -d ${POSTGRES_DB:-vitaia_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - vitaia-network
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.5"

  # Redis for caching and session storage
  redis:
    image: redis:7-alpine
    container_name: vitaia-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-vitaia_redis_password}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - vitaia-network
    security_opt:
      - no-new-privileges:true

  # VITAIA Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    container_name: vitaia-app
    ports:
      - "${APP_PORT:-5000}:5000"
    environment:
      # Application
      NODE_ENV: production
      PORT: 5000
      HOST: 0.0.0.0

      # Security
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      ENABLE_SECURITY_HEADERS: true
      ENABLE_RATE_LIMIT: true
      ENABLE_AUDIT_LOG: true
      ENABLE_ENCRYPTION: true

      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-vitaia}:${POSTGRES_PASSWORD:-vitaia_secure_password_change_me}@postgres:5432/${POSTGRES_DB:-vitaia_db}

      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD:-vitaia_redis_password}@redis:6379

      # AI Providers (configure your API keys)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEFAULT_AI_PROVIDER: ${DEFAULT_AI_PROVIDER:-gemini}
      ENABLE_MULTI_PROVIDER: ${ENABLE_MULTI_PROVIDER:-true}

      # Medical AI Settings
      ENABLE_MEDICAL_VALIDATION: true
      ENABLE_CLINICAL_GUIDELINES: true
      ENABLE_DRUG_INTERACTION_CHECK: true

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENABLE_DEBUG_LOGS: ${ENABLE_DEBUG_LOGS:-false}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - vitaia-network
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
    # Mount logs directory for persistent logging
    volumes:
      - app_logs:/app/logs

  # Nginx reverse proxy (optional, for production)
  nginx:
    image: nginx:alpine
    container_name: vitaia-nginx
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - vitaia-network
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  app_logs:
    driver: local
  nginx_logs:
    driver: local

networks:
  vitaia-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
